
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PolyJobs;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Email Configuration (for JavaMailSender)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ═══ DEV TOOLS - Hot Reload ═══
# Tắt cache Thymeleaf → thay đổi HTML thấy ngay khi F5
spring.thymeleaf.cache=false
# Tắt cache static resources (CSS, JS, ảnh)
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
# DevTools LiveReload (tự refresh trình duyệt)
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# ═══ EXTERNAL FILE UPLOAD DIRECTORY ═══
# Thư mục lưu ảnh, logo, CV (Sử dụng đường dẫn tương đối để chạy được trên mọi máy)
app.upload.dir=D:/uploads_polyjobs/