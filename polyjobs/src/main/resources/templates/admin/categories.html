<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Danh mục Ngành nghề')}"></head>
<body class="d-flex">

<aside th:replace="~{admin/fragments :: sidebar('categories')}"></aside>

<div class="adm-main">
    <div class="adm-topbar">
        <div>
            <div class="adm-topbar-title">Danh mục Ngành nghề</div>
            <div class="adm-topbar-subtitle">Quản lý các danh mục việc làm</div>
        </div>
        <div class="d-flex align-items-center gap-3 ms-auto">
            <a href="/admin/category/add" class="adm-btn adm-btn-primary"><i class="fa-solid fa-plus"></i> Thêm danh mục</a>
            <img th:src="${session.loggedInUser.avatar != null ? session.loggedInUser.avatar : 'https://ui-avatars.com/api/?name=' + session.loggedInUser.fullname + '&background=6366f1&color=fff'}" class="adm-topbar-avatar" alt="avatar">
        </div>
    </div>

    <div class="adm-content">
        <div class="adm-breadcrumb">
            <a href="/admin/dashboard"><i class="fa-solid fa-house" style="font-size:.7rem;"></i></a>
            <span class="sep">/</span><span class="current">Danh mục</span>
        </div>

        <div th:if="${success}" class="adm-alert adm-alert-success"><i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span></div>
        <div th:if="${error}"   class="adm-alert adm-alert-danger"><i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span></div>

        <div class="adm-card">
            <div class="adm-card-header">
                <span class="adm-card-title"><i class="fa-solid fa-layer-group me-2" style="color:var(--adm-info);"></i>Danh sách (<span th:text="${categories.size()}">0</span>)</span>
            </div>
            <div style="overflow-x:auto;">
                <table class="adm-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Tên danh mục</th>
                            <th>Mô tả</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat, iterStat : ${categories}">
                            <td style="color:var(--adm-text-light);font-size:.78rem;" th:text="${iterStat.count}">1</td>
                            <td>
                                <span style="font-weight:600;font-size:.875rem;" th:text="${cat.name}">Tên</span>
                            </td>
                            <td>
                                <span style="font-size:.82rem;color:var(--adm-text-muted);" th:text="${cat.description != null ? cat.description : '—'}">Mô tả</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/admin/category/edit/{id}(id=${cat.id})}" class="adm-btn adm-btn-ghost adm-btn-sm"><i class="fa-solid fa-pen"></i> Sửa</a>
                                    <a th:href="@{/admin/category/delete/{id}(id=${cat.id})}" class="adm-btn adm-btn-danger adm-btn-sm"
                                       onclick="return confirm('Xóa danh mục này?');"><i class="fa-solid fa-trash"></i></a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${categories.isEmpty()}">
                            <td colspan="4">
                                <div class="adm-empty">
                                    <div class="adm-empty-icon"><i class="fa-solid fa-layer-group"></i></div>
                                    <div class="adm-empty-title">Chưa có danh mục nào</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
