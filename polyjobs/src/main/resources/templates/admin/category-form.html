<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${category.id != null ? 'Sửa Danh mục' : 'Thêm Danh mục'})}"></head>
<body class="d-flex">

<aside th:replace="~{admin/fragments :: sidebar('categories')}"></aside>

<div class="adm-main">
    <div class="adm-topbar">
        <div>
            <div class="adm-topbar-title" th:text="${category.id != null ? 'Sửa Danh mục' : 'Thêm Danh mục mới'}">Danh mục</div>
            <div class="adm-topbar-subtitle">Cấu hình thông tin danh mục ngành nghề</div>
        </div>
        <div class="d-flex align-items-center gap-3 ms-auto">
            <a href="/admin/categories" class="adm-btn adm-btn-ghost"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
            <img th:src="${session.loggedInUser.avatar != null ? session.loggedInUser.avatar : 'https://ui-avatars.com/api/?name=' + session.loggedInUser.fullname + '&background=6366f1&color=fff'}" class="adm-topbar-avatar" alt="avatar">
        </div>
    </div>

    <div class="adm-content">
        <div class="adm-breadcrumb">
            <a href="/admin/dashboard"><i class="fa-solid fa-house" style="font-size:.7rem;"></i></a>
            <span class="sep">/</span>
            <a href="/admin/categories">Danh mục</a>
            <span class="sep">/</span>
            <span class="current" th:text="${category.id != null ? 'Sửa' : 'Thêm mới'}">Thêm mới</span>
        </div>

        <div class="adm-card" style="max-width:600px;">
            <div class="adm-card-header">
                <span class="adm-card-title"><i class="fa-solid fa-layer-group me-2" style="color:var(--adm-info);"></i><span th:text="${category.id != null ? 'Chỉnh sửa thông tin' : 'Danh mục mới'}"></span></span>
            </div>
            <div class="adm-card-body">
                <form th:action="@{/admin/category/save}" method="post">
                    <input type="hidden" name="id" th:value="${category.id}" />

                    <div class="adm-form-group">
                        <label class="adm-form-label">Tên Danh mục <span class="req">*</span></label>
                        <input type="text" class="adm-input" name="name" th:value="${category.name}"
                               required placeholder="Ví dụ: Công nghệ thông tin">
                    </div>

                    <div class="adm-form-group">
                        <label class="adm-form-label">Mô tả chi tiết</label>
                        <textarea class="adm-textarea" name="description" rows="4"
                                  placeholder="Mô tả ngắn về lĩnh vực này..." th:text="${category.description}"></textarea>
                    </div>

                    <div class="d-flex justify-content-between pt-2">
                        <a href="/admin/categories" class="adm-btn adm-btn-ghost"><i class="fa-solid fa-times"></i> Hủy bỏ</a>
                        <button type="submit" class="adm-btn adm-btn-primary"><i class="fa-solid fa-floppy-disk"></i> Lưu danh mục</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
