<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — PolyJobs Admin'">Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>

<!-- ═══ SIDEBAR FRAGMENT ═══ -->
<aside th:fragment="sidebar(activeMenu)" class="adm-sidebar" id="admSidebar">
    <div class="adm-sidebar-brand">
        <div class="adm-sidebar-logo"><i class="fa-solid fa-water"></i></div>
        <div>
            <div class="adm-sidebar-name">PolyJobs</div>
            <div class="adm-sidebar-sub">Admin Dashboard</div>
        </div>
    </div>

    <nav class="adm-nav pt-2" style="overflow-y:auto; flex:1;">
        <div class="adm-sidebar-section">Tổng quan</div>
        <li class="adm-nav-item">
            <a class="adm-nav-link" th:classappend="${activeMenu == 'dashboard'} ? 'active'" th:href="@{/admin/dashboard}">
                <i class="fa-solid fa-chart-pie nav-icon"></i> Bảng điều khiển
            </a>
        </li>

        <div class="adm-sidebar-section mt-2">Quản lý</div>
        <li class="adm-nav-item">
            <a class="adm-nav-link" th:classappend="${activeMenu == 'users'} ? 'active'" th:href="@{/admin/users}">
                <i class="fa-solid fa-users nav-icon"></i> Người dùng
            </a>
        </li>
        <li class="adm-nav-item">
            <a class="adm-nav-link" th:classappend="${activeMenu == 'jobs'} ? 'active'" th:href="@{/admin/jobs}">
                <i class="fa-solid fa-briefcase nav-icon"></i> Việc làm
            </a>
        </li>
        <li class="adm-nav-item">
            <a class="adm-nav-link" th:classappend="${activeMenu == 'categories'} ? 'active'" th:href="@{/admin/categories}">
                <i class="fa-solid fa-layer-group nav-icon"></i> Danh mục
            </a>
        </li>
        <li class="adm-nav-item">
            <a class="adm-nav-link" th:classappend="${activeMenu == 'posts'} ? 'active'" th:href="@{/admin/posts}">
                <i class="fa-solid fa-newspaper nav-icon"></i> Bài đăng
            </a>
        </li>
    </nav>

    <div class="adm-sidebar-footer">
        <div class="adm-divider mb-3"></div>
        <form th:action="@{/logout}" method="post" class="m-0 p-0 w-100">
            <button type="submit" class="adm-nav-link border-0 w-100 text-start" style="background: transparent; color: rgba(255,255,255,0.4);">
                <i class="fa-solid fa-right-from-bracket nav-icon" style="color: #ef4444;"></i>
                <span>Đăng xuất</span>
            </button>
        </form>
    </div>
</aside>

<!-- ═══ TOPBAR FRAGMENT ═══ -->
<div th:fragment="topbar(title, subtitle)" class="adm-topbar">
    <style>
        .adm-topbar .dropdown {
            position: relative;
        }
        .adm-topbar .dropdown:hover .dropdown-menu {
            display: block;
            margin-top: 0;
        }
        .adm-topbar .dropdown-menu {
            top: 100%;
            right: 0 !important;
            left: auto !important;
            transition: all 0.2s ease-in-out;
        }
    </style>
    <div>
        <div class="adm-topbar-title" th:text="${title}">Title</div>
        <div class="adm-topbar-subtitle" th:text="${subtitle}">Subtitle</div>
    </div>
    <div class="d-flex align-items-center gap-3 ms-auto">
        <div class="dropdown">
            <div class="d-flex align-items-center gap-3" style="cursor: pointer; padding-bottom: 5px;">
                <div class="text-end">
                    <span class="adm-topbar-user">
                        <strong th:text="${session.loggedInUser.fullname}">Admin</strong>
                        Quản trị viên
                    </span>
                </div>
                <img th:src="${session.loggedInUser.avatar != null ? session.loggedInUser.avatar : 'https://ui-avatars.com/api/?name=' + session.loggedInUser.fullname + '&background=6366f1&color=fff'}"
                     class="adm-topbar-avatar" alt="avatar">
            </div>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" style="border: none; border-radius: 12px; margin-top: 5px;">
                <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="fa-regular fa-user me-2 text-primary"></i>Thông tin cá nhân</a></li>
                <li><a class="dropdown-item py-2" th:href="@{/}"><i class="fa-solid fa-house me-2 text-success"></i>Về trang chủ</a></li>
                <li><hr class="dropdown-divider"></li>
                <!-- Spring security requires POST for logout by default if CSRF is enabled, but we can use GET if CSRF is disabled or via form -->
                <!-- Since we have CSRF disabled for /logout or are using GET /logout (Wait, standard Spring Security allows GET /logout if CSRF is disabled or via config) -->
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0 p-0">
                        <button type="submit" class="dropdown-item py-2 text-danger border-0 bg-transparent text-start w-100"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>

<!-- ═══ SCRIPTS FRAGMENT ═══ -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-hide alerts
        document.querySelectorAll('.adm-alert').forEach(el => {
            setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 4000);
        });
    </script>
</div>

<!-- ═══ PAGINATION FRAGMENT ═══ -->
<div th:fragment="pagination(baseUrl)" th:if="${totalPages != null and totalPages > 1}">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:20px;">

        <!-- Info text -->
        <div style="font-size:.8rem;color:#94a3b8;">
            Trang <strong style="color:#1e293b;" th:text="${currentPage + 1}"></strong>
            / <strong style="color:#1e293b;" th:text="${totalPages}"></strong>
            &nbsp;·&nbsp; Tổng <strong style="color:#1e293b;" th:text="${totalElements}"></strong> bản ghi
        </div>

        <!-- Page buttons -->
        <div style="display:flex;align-items:center;gap:5px;">

            <!-- Trang đầu -->
            <a th:if="${hasPrev}" th:href="${baseUrl + '&page=0'}"
               style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;text-decoration:none;font-size:.8rem;transition:all .15s;"
               title="Trang đầu"
               onmouseover="this.style.borderColor='#6366f1';this.style.color='#6366f1'"
               onmouseout="this.style.borderColor='#e2e8f0';this.style.color='#64748b'">
              <i class="fa-solid fa-angles-left fa-xs"></i>
            </a>

            <!-- Trước -->
            <a th:if="${hasPrev}" th:href="${baseUrl + '&page=' + (currentPage - 1)}"
               style="display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 12px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;text-decoration:none;font-size:.82rem;font-weight:600;gap:5px;transition:all .15s;"
               onmouseover="this.style.borderColor='#6366f1';this.style.color='#6366f1'"
               onmouseout="this.style.borderColor='#e2e8f0';this.style.color='#64748b'">
              <i class="fa-solid fa-chevron-left fa-xs"></i> Trước
            </a>

            <!-- Số trang -->
            <span th:each="p : ${pageNumbers}">
              <span th:if="${p == currentPage}"
                    style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#6366f1;color:#fff;font-size:.82rem;font-weight:700;border:1.5px solid #6366f1;"
                    th:text="${p + 1}"></span>
              <a th:if="${p != currentPage}" th:href="${baseUrl + '&page=' + p}" th:text="${p + 1}"
                 style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;text-decoration:none;font-size:.82rem;font-weight:600;transition:all .15s;"
                 onmouseover="this.style.borderColor='#6366f1';this.style.color='#6366f1';this.style.background='rgba(99,102,241,.06)'"
                 onmouseout="this.style.borderColor='#e2e8f0';this.style.color='#64748b';this.style.background='#fff'"></a>
            </span>

            <!-- Tiếp -->
            <a th:if="${hasNext}" th:href="${baseUrl + '&page=' + (currentPage + 1)}"
               style="display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 12px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;text-decoration:none;font-size:.82rem;font-weight:600;gap:5px;transition:all .15s;"
               onmouseover="this.style.borderColor='#6366f1';this.style.color='#6366f1'"
               onmouseout="this.style.borderColor='#e2e8f0';this.style.color='#64748b'">
              Tiếp <i class="fa-solid fa-chevron-right fa-xs"></i>
            </a>

            <!-- Trang cuối -->
            <a th:if="${hasNext}" th:href="${baseUrl + '&page=' + (totalPages - 1)}"
               style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;text-decoration:none;font-size:.8rem;transition:all .15s;"
               title="Trang cuối"
               onmouseover="this.style.borderColor='#6366f1';this.style.color='#6366f1'"
               onmouseout="this.style.borderColor='#e2e8f0';this.style.color='#64748b'">
              <i class="fa-solid fa-angles-right fa-xs"></i>
            </a>
        </div>
    </div>
</div>

</body>
</html>
