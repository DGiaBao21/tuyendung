<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Quản lý Việc làm')}"></head>
<body class="d-flex">

<aside th:replace="~{admin/fragments :: sidebar('jobs')}"></aside>

<div class="adm-main">
    <!-- Topbar -->
    <div th:replace="~{admin/fragments :: topbar('Quản lý Việc làm', 'Tất cả tin tuyển dụng trong hệ thống')}"></div>

    <div class="adm-content">
        <div class="adm-breadcrumb">
            <a href="/admin/dashboard"><i class="fa-solid fa-house" style="font-size:.7rem;"></i></a>
            <span class="sep">/</span><span class="current">Việc làm</span>
        </div>

        <div th:if="${success}" class="adm-alert adm-alert-success"><i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span></div>

        <div class="adm-card">
            <div class="adm-card-header">
                <span class="adm-card-title"><i class="fa-solid fa-briefcase me-2" style="color:var(--adm-warning);"></i>Tin tuyển dụng (<span th:text="${totalElements}">0</span>)</span>
            </div>
            <div style="overflow-x:auto;">
                <table class="adm-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Tin tuyển dụng</th>
                            <th>Công ty</th>
                            <th>Ngày đăng / Hạn</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="job, iterStat : ${jobs}">
                            <td style="color:var(--adm-text-light);font-size:.78rem;" th:text="${iterStat.count}">1</td>
                            <td>
                                <a th:href="@{/job/{id}(id=${job.id})}" target="_blank" style="font-weight:600;font-size:.875rem;" th:text="${job.title}">Tiêu đề</a>
                                <div style="font-size:.78rem;color:var(--adm-text-muted); margin-top:2px;" th:text="${job.location}">Khu vực</div>
                            </td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <img th:src="${job.company.logo != null ? job.company.logo : 'https://ui-avatars.com/api/?name=' + job.company.companyName + '&background=e8eaf0&color=64748b&size=32'}"
                                         style="width:28px;height:28px;border-radius:6px;object-fit:cover;">
                                    <span style="font-size:.82rem;" th:text="${job.company.companyName}">Công ty</span>
                                </div>
                            </td>
                            <td>
                                <div style="font-size:.78rem;color:var(--adm-text-muted);" th:text="${#dates.format(job.createdDate, 'dd/MM/yyyy')}">Ngày đăng</div>
                                <div style="font-size:.78rem;color:var(--adm-danger);">Hạn: <span th:text="${#dates.format(job.deadline, 'dd/MM/yyyy')}"></span></div>
                            </td>
                            <td>
                                <span class="adm-badge adm-badge-success" th:if="${job.status and (job.isHidden == null or !job.isHidden)}"><i class="fa-solid fa-circle" style="font-size:.45rem;"></i> Đang hiển thị</span>
                                <span class="adm-badge adm-badge-neutral" th:if="${!job.status}">Đã đóng</span>
                                <span class="adm-badge adm-badge-danger"  th:if="${job.isHidden}">Bị ẩn (Admin)</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2 justify-content-end">
                                    <a th:href="@{/job/{id}(id=${job.id})}" target="_blank" class="adm-btn adm-btn-ghost adm-btn-sm"><i class="fa-solid fa-eye"></i></a>
                                    <form th:action="@{/admin/jobs/toggle-hide/{id}(id=${job.id})}" method="post" onsubmit="return confirm('Thay đổi trạng thái tin này?');">
                                        <button type="submit" class="adm-btn adm-btn-sm" th:classappend="${job.isHidden} ? 'adm-btn-success' : 'adm-btn-warning'">
                                            <i class="fa-solid" th:classappend="${job.isHidden} ? 'fa-eye' : 'fa-eye-slash'"></i>
                                            <span th:text="${job.isHidden} ? 'Hiện' : 'Ẩn'"></span>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${jobs.isEmpty()}">
                            <td colspan="6">
                                <div class="adm-empty">
                                    <div class="adm-empty-icon"><i class="fa-solid fa-briefcase"></i></div>
                                    <div class="adm-empty-title">Chưa có tin tuyển dụng nào</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Phân trang -->
        <div th:replace="~{admin/fragments :: pagination('/admin/jobs')}"></div>

    </div>
</div>

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
