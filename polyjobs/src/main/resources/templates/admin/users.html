<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Quản lý Người dùng')}"></head>
<body class="d-flex">

<aside th:replace="~{admin/fragments :: sidebar('users')}"></aside>

<div class="adm-main">
    <!-- Topbar -->
    <div th:replace="~{admin/fragments :: topbar('Quản lý Người dùng', 'Danh sách tài khoản trên hệ thống')}"></div>

    <div class="adm-content">
        <div class="adm-breadcrumb">
            <a href="/admin/dashboard"><i class="fa-solid fa-house" style="font-size:.7rem;"></i></a>
            <span class="sep">/</span>
            <span class="current">Người dùng</span>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="adm-alert adm-alert-success"><i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span></div>
        <div th:if="${error}"   class="adm-alert adm-alert-danger"><i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span></div>

        <div class="adm-card">
            <div class="adm-card-header">
                <span class="adm-card-title"><i class="fa-solid fa-users me-2" style="color:var(--adm-primary);"></i>Tất cả người dùng (<span th:text="${totalElements}">0</span>)</span>
            </div>

            <div style="overflow-x:auto;">
                <table class="adm-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Người dùng</th>
                            <th>Liên hệ</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user, iterStat : ${users}">
                            <td style="color:var(--adm-text-light); font-size:.78rem;" th:text="${iterStat.count}">1</td>
                            <td>
                                <div class="adm-avatar-group">
                                    <img th:src="${user.avatar != null ? user.avatar : 'https://ui-avatars.com/api/?name=' + user.fullname + '&background=6366f1&color=fff'}" class="adm-avatar">
                                    <div class="adm-avatar-info">
                                        <div class="name" th:text="${user.fullname}">Họ tên</div>
                                        <div class="email" th:text="'@' + ${user.username}">@username</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div style="font-size:.82rem;" th:text="${user.email}">email</div>
                                <div style="font-size:.78rem; color:var(--adm-text-muted);" th:text="${user.phone != null ? user.phone : '—'}">phone</div>
                            </td>
                            <td>
                                <span class="adm-badge adm-badge-danger"   th:if="${user.isAdmin == true}"><i class="fa-solid fa-shield-halved"></i> Admin</span>
                                <span class="adm-badge adm-badge-primary"  th:if="${user.isAdmin != true and user.role == true}"><i class="fa-solid fa-building"></i> NTD</span>
                                <span class="adm-badge adm-badge-info"     th:if="${user.isAdmin != true and user.role != true}"><i class="fa-solid fa-user"></i> Ứng viên</span>
                            </td>
                            <td>
                                <span class="adm-badge adm-badge-success" th:if="${user.isActive == true}"><i class="fa-solid fa-circle" style="font-size:.5rem;"></i> Hoạt động</span>
                                <span class="adm-badge adm-badge-neutral" th:if="${user.isActive != true}"><i class="fa-solid fa-circle" style="font-size:.5rem;"></i> Bị chặn</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2 justify-content-end">
                                    <button type="button" class="adm-btn adm-btn-ghost adm-btn-sm"
                                            data-bs-toggle="modal" th:attr="data-bs-target='#userModal' + ${user.id}">
                                        <i class="fa-solid fa-eye"></i> Chi tiết
                                    </button>
                                    <form th:if="${user.id != session.loggedInUser.id and user.isAdmin != true}"
                                          th:action="@{/admin/users/toggle-block/{id}(id=${user.id})}" method="post"
                                          onsubmit="return confirm('Thay đổi trạng thái người dùng?');">
                                        <button type="submit" class="adm-btn adm-btn-sm"
                                                th:classappend="${user.isActive == true} ? 'adm-btn-danger' : 'adm-btn-success'">
                                            <i class="fa-solid" th:classappend="${user.isActive == true} ? 'fa-ban' : 'fa-unlock'"></i>
                                            <span th:text="${user.isActive == true} ? 'Chặn' : 'Bỏ chặn'"></span>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${users.isEmpty()}">
                            <td colspan="6">
                                <div class="adm-empty">
                                    <div class="adm-empty-icon"><i class="fa-solid fa-users"></i></div>
                                    <div class="adm-empty-title">Chưa có người dùng nào</div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<th:block th:each="user : ${users}">
    <div class="modal fade" th:id="'userModal' + ${user.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius:16px; overflow:hidden;">
                <div class="modal-header border-0" style="background: linear-gradient(135deg,#6366f1,#818cf8); color:#fff; padding:20px 24px;">
                    <h5 class="modal-title fw-bold">Chi tiết người dùng</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="text-center mb-4">
                        <img th:src="${user.avatar != null ? user.avatar : 'https://ui-avatars.com/api/?name=' + user.fullname + '&background=6366f1&color=fff&size=128'}"
                             style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #e8eaf0;">
                        <h5 class="fw-bold mt-2 mb-0" th:text="${user.fullname}">Tên</h5>
                        <p style="color:var(--adm-text-muted); font-size:.82rem;" th:text="'@' + ${user.username}">@user</p>
                    </div>
                    <div style="background:#f8f9fc; border-radius:10px; padding:16px;">
                        <div class="d-flex justify-content-between border-bottom py-2">
                            <span style="font-size:.82rem; color:var(--adm-text-muted);">Email</span>
                            <span style="font-size:.82rem; font-weight:500;" th:text="${user.email}">—</span>
                        </div>
                        <div class="d-flex justify-content-between border-bottom py-2">
                            <span style="font-size:.82rem; color:var(--adm-text-muted);">Điện thoại</span>
                            <span style="font-size:.82rem; font-weight:500;" th:text="${user.phone != null ? user.phone : '—'}">—</span>
                        </div>
                        <div class="d-flex justify-content-between border-bottom py-2">
                            <span style="font-size:.82rem; color:var(--adm-text-muted);">Địa chỉ</span>
                            <span style="font-size:.82rem; font-weight:500;" th:text="${user.address != null ? user.address : '—'}">—</span>
                        </div>
                        <div class="d-flex justify-content-between py-2">
                            <span style="font-size:.82rem; color:var(--adm-text-muted);">Ngành nghề</span>
                            <span style="font-size:.82rem; font-weight:500;" th:text="${user.profession != null ? user.profession : '—'}">—</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phan trang -->
        <div th:replace="~{admin/fragments :: pagination(${baseUrl})}"></div>

    </div><!-- end adm-content -->
</div><!-- end adm-main -->

<div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
