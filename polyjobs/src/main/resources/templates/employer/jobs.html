<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quản lý tin tuyển dụng')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar('employer')}"></nav>

    <div class="container py-5">
        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <h2 class="mb-0"><i class="fa-solid fa-briefcase me-2 text-primary"></i> Quản lý tin tuyển dụng</h2>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <a th:href="@{/employer/job/add}" class="btn btn-primary"><i class="fa-solid fa-plus me-2"></i> Đăng tin mới</a>
            </div>
        </div>

        <div class="alert alert-success" th:if="${success}">
            <i class="fa-solid fa-circle-check me-2"></i><span th:text="${success}"></span>
        </div>
        <div class="alert alert-danger" th:if="${error}">
            <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${error}"></span>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Tin tuyển dụng</th>
                                <th>Danh mục</th>
                                <th>Ngày hết hạn</th>
                                <th>Trạng thái</th>
                                <th class="text-end">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="job : ${jobs}">
                                <td>
                                    <a th:href="@{/job/{id}(id=${job.id})}" target="_blank" class="fw-bold text-decoration-none" th:text="${job.title}">Tên công việc</a>
                                    <div class="small text-muted" th:text="${job.location}">Địa điểm</div>
                                </td>
                                <td th:text="${job.category != null ? job.category.name : 'N/A'}">Danh mục</td>
                                <td th:text="${#dates.format(job.deadline, 'dd/MM/yyyy')}">30/06/2026</td>
                                <td>
                                    <span class="badge bg-success" th:if="${job.status}">Đang mở</span>
                                    <span class="badge bg-secondary" th:unless="${job.status}">Đã đóng</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/employer/job/edit/{id}(id=${job.id})}" class="btn btn-sm btn-outline-primary" title="Sửa">
                                        <i class="fa-solid fa-pen"></i>
                                    </a>
                                    <form th:action="@{/employer/job/toggle-status}" method="post" class="d-inline">
                                        <input type="hidden" name="id" th:value="${job.id}">
                                        <button type="submit" class="btn btn-sm btn-outline-warning" th:title="${job.status ? 'Đóng tin' : 'Mở lại tin'}">
                                            <i class="fa-solid" th:classappend="${job.status ? 'fa-lock' : 'fa-lock-open'}"></i>
                                        </button>
                                    </form>
                                    <a th:href="@{/employer/applications/{jobId}(jobId=${job.id})}" class="btn btn-sm btn-outline-info" title="Xem ứng viên">
                                        <i class="fa-solid fa-users"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${jobs.isEmpty()}">
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <i class="fa-solid fa-box-open fs-2 mb-2 d-block"></i>
                                    Bạn chưa đăng tin tuyển dụng nào.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
    <div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
