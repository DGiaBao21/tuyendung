<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quản lý tin tuyển dụng')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('employer')}"></nav>

<div style="background:#f8f9fc; min-height:calc(100vh - 72px); padding: 32px 0;">
    <div class="container-lg">

        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 style="font-weight:800; margin:0; color:#1e293b;">Quản lý tin tuyển dụng</h4>
                <p style="color:#64748b; font-size:.85rem; margin:4px 0 0;">Tất cả tin đăng tuyển của bạn</p>
            </div>
            <a th:href="@{/employer/job/add}" style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;font-weight:600;font-size:.875rem;text-decoration:none;box-shadow:0 4px 14px rgba(99,102,241,.35);transition:all .2s;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform=''">
                <i class="fa-solid fa-plus"></i> Đăng tin mới
            </a>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:#15803d;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#b91c1c;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <!-- Job Cards -->
        <div th:if="${!jobs.isEmpty()}" class="d-flex flex-column gap-3">
            <div th:each="job : ${jobs}"
                 style="background:#fff;border-radius:14px;border:1.5px solid #e8eaf0;padding:20px 24px;display:flex;align-items:center;gap:20px;transition:all .2s;box-shadow:0 1px 4px rgba(0,0,0,.04);"
                 onmouseover="this.style.borderColor='#6366f1';this.style.boxShadow='0 4px 20px rgba(99,102,241,.12)'"
                 onmouseout="this.style.borderColor='#e8eaf0';this.style.boxShadow='0 1px 4px rgba(0,0,0,.04)'">

                <!-- Status dot -->
                <div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;"
                     th:style="${job.status} ? 'background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5);' : 'background:#94a3b8;'"></div>

                <!-- Info -->
                <div style="flex:1;min-width:0;">
                    <a th:href="@{/job/{id}(id=${job.id})}" target="_blank"
                       style="font-weight:700;font-size:.975rem;color:#1e293b;text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" th:text="${job.title}">Tiêu đề</a>
                    <div style="display:flex;align-items:center;gap:16px;margin-top:6px;flex-wrap:wrap;">
                        <span style="font-size:.78rem;color:#64748b;"><i class="fa-solid fa-location-dot me-1" style="color:#6366f1;"></i><span th:text="${job.location}"></span></span>
                        <span style="font-size:.78rem;color:#64748b;" th:if="${job.category != null}"><i class="fa-solid fa-layer-group me-1" style="color:#06b6d4;"></i><span th:text="${job.category.name}"></span></span>
                        <span style="font-size:.78rem;color:#64748b;"><i class="fa-regular fa-calendar me-1" style="color:#f59e0b;"></i>Hạn: <span th:text="${#dates.format(job.deadline, 'dd/MM/yyyy')}"></span></span>
                    </div>
                </div>

                <!-- Status badge -->
                <div style="flex-shrink:0;">
                    <span th:if="${job.status}" style="display:inline-block;padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700;background:rgba(34,197,94,.1);color:#16a34a;">● Đang mở</span>
                    <span th:unless="${job.status}" style="display:inline-block;padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:700;background:#f1f5f9;color:#64748b;">● Đã đóng</span>
                </div>

                <!-- Actions -->
                <div style="display:flex;gap:8px;flex-shrink:0;align-items:center;">
                    <!-- Badge số CV -->
                    <a th:href="@{/employer/applications/{jobId}(jobId=${job.id})}"
                       style="display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;background:rgba(99,102,241,.08);border:1.5px solid rgba(99,102,241,.2);font-size:.8rem;font-weight:600;color:#6366f1;text-decoration:none;transition:all .2s;position:relative;"
                       onmouseover="this.style.background='#6366f1';this.style.color='#fff';"
                       onmouseout="this.style.background='rgba(99,102,241,.08)';this.style.color='#6366f1';">
                        <i class="fa-solid fa-file-lines"></i>
                        <span th:text="${applicationCountMap[job.id] != null ? applicationCountMap[job.id] : 0}">0</span> CV
                        <!-- Badge chờ duyệt -->
                        <span th:if="${pendingCountMap[job.id] != null and pendingCountMap[job.id] > 0}"
                              th:text="${pendingCountMap[job.id]}"
                              style="position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;background:#ef4444;color:#fff;border-radius:50%;font-size:.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;"></span>
                    </a>
                    <a th:href="@{/employer/job/edit/{id}(id=${job.id})}"
                       style="display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;border:1.5px solid #e8eaf0;font-size:.8rem;font-weight:600;color:#64748b;text-decoration:none;transition:all .2s;"
                       onmouseover="this.style.borderColor='#6366f1';this.style.color='#6366f1';"
                       onmouseout="this.style.borderColor='#e8eaf0';this.style.color='#64748b';">
                        <i class="fa-solid fa-pen"></i> Sửa
                    </a>
                    <form th:action="@{/employer/job/toggle-status}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${job.id}">
                        <button type="submit" style="display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;border:1.5px solid #e8eaf0;background:transparent;color:#64748b;transition:all .2s;"
                                onmouseover="this.style.borderColor='#f59e0b';this.style.color='#d97706';"
                                onmouseout="this.style.borderColor='#e8eaf0';this.style.color='#64748b';">
                            <i class="fa-solid" th:classappend="${job.status} ? 'fa-lock' : 'fa-lock-open'"></i>
                            <span th:text="${job.status} ? 'Đóng tin' : 'Mở lại'"></span>
                        </button>
                    </form>
                </div>

            </div>
        </div>

        <!-- Empty state -->
        <div th:if="${jobs.isEmpty()}" style="background:#fff;border-radius:16px;border:1.5px dashed #d1d5db;padding:60px 24px;text-align:center;">
            <div style="width:72px;height:72px;background:#f1f5f9;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.8rem;color:#94a3b8;">
                <i class="fa-solid fa-briefcase"></i>
            </div>
            <h5 style="color:#1e293b;font-weight:700;margin-bottom:6px;">Chưa có tin tuyển dụng nào</h5>
            <p style="color:#64748b;font-size:.875rem;margin-bottom:20px;">Bắt đầu bằng cách đăng tin tuyển dụng đầu tiên của bạn!</p>
            <a th:href="@{/employer/job/add}" style="display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:10px;background:#6366f1;color:#fff;font-weight:600;font-size:.875rem;text-decoration:none;">
                <i class="fa-solid fa-plus"></i> Đăng tin ngay
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
