<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>PolyJobs - Cổng thông tin việc làm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-primary mb-4">Danh sách Việc làm mới nhất</h1>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tiêu đề công việc</th>
                    <th>Mức lương</th>
                    <th>Kinh nghiệm</th>
                    <th>Địa điểm</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="job : ${jobs}">
                    <td th:text="${job.id}">1</td>
                    <td class="fw-bold" th:text="${job.title}">Lập trình viên Java</td>
                    <td class="text-danger" th:text="${job.salary}">10 - 15 Triệu</td>
                    <td th:text="${job.experience}">1 năm</td>
                    <td th:text="${job.location}">Cần Thơ</td>
                    <td>
                        <button class="btn btn-sm btn-success">Ứng tuyển ngay</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
