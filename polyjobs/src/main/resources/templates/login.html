<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Đăng Nhập')}"></head>

<body>

    <div class="auth-page">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <i class="fa-solid fa-water"></i> PolyJobs
            </div>
            <h1 class="auth-title">Đăng Nhập</h1>
            <p class="auth-subtitle">Chào mừng bạn trở lại! Đăng nhập để tiếp tục.</p>

            <!-- Alert Messages -->
            <div class="alert alert-polyjobs alert-danger" th:if="${error}" id="alertError">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span th:text="${error}">Lỗi</span>
            </div>
            <div class="alert alert-polyjobs alert-success" th:if="${success}" id="alertSuccess">
                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${success}">Thành công</span>
            </div>

            <!-- Login Form -->
            <form class="auth-form" action="/login" method="post" id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username"
                            placeholder="Nhập tên đăng nhập" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Nhập mật khẩu" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth" id="btnLogin">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Đăng Nhập
                </button>
            </form>

            <div class="auth-divider">hoặc</div>

            <div class="auth-footer">
                Chưa có tài khoản?
                <a th:href="@{/register}">Đăng ký ngay</a>
            </div>

            <div style="text-align: center; margin-top: 16px;">
                <a th:href="@{/}" style="color: var(--text-muted); font-size: 0.85rem;">
                    <i class="fa-solid fa-arrow-left me-1"></i> Quay về trang chủ
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
