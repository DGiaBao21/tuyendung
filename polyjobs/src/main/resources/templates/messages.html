<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments :: head('Tin nhắn')}"></div>
    <style>
        .chat-container {
            height: calc(100vh - 120px);
            display: flex;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #fff;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .chat-sidebar {
            width: 320px;
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        .chat-sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 700;
            font-size: 1.2rem;
            color: #0f172a;
        }
        .user-list {
            flex-grow: 1;
            overflow-y: auto;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.2s;
        }
        .user-item:hover, .user-item.active {
            background: #e0e7ff;
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }
        .user-name {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.95rem;
        }
        
        .chat-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            background: #fff;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }
        .msg-sent {
            align-self: flex-end;
            background: var(--gradient-primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-received {
            align-self: flex-start;
            background: #fff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .msg-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }
        .chat-input-area {
            padding: 20px;
            background: #fff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 15px;
        }
        .chat-input {
            flex-grow: 1;
            border: 1px solid #cbd5e1;
            border-radius: 24px;
            padding: 12px 20px;
            outline: none;
            transition: all 0.2s;
        }
        .chat-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .btn-send {
            background: var(--gradient-primary);
            color: #fff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        
        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
        }
        .empty-chat i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #cbd5e1;
        }
        .unread-badge {
            background: #ef4444;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            min-width: 22px;
            height: 22px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
    </style>
</head>
<body class="bg-light">

<nav th:replace="~{fragments :: navbar('none')}"></nav>

<div class="container">
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="chat-sidebar">
            <div class="chat-sidebar-header">
                <i class="fa-brands fa-rocketchat text-primary me-2"></i> Tin nhắn
            </div>
            <div class="user-list" id="userList">
                <!-- Vòng lặp hiển thị danh sách người dùng đã chat -->
                <div th:each="user : ${chattedUsers}" 
                     th:id="'user-item-' + ${user.id}"
                     class="user-item" 
                     th:data-user-id="${user.id}"
                     th:data-user-name="${user.fullname}"
                     th:data-user-avatar="${user.avatar != null ? user.avatar : 'https://ui-avatars.com/api/?name=' + #strings.replace(user.fullname, ' ', '+') + '&background=6366f1&color=fff'}">
                    <img th:src="${user.avatar != null ? user.avatar : 'https://ui-avatars.com/api/?name=' + #strings.replace(user.fullname, ' ', '+') + '&background=6366f1&color=fff'}" class="user-avatar" alt="Avatar">
                    <div style="flex:1;min-width:0;">
                        <div class="user-name" th:text="${user.fullname}">Tên người dùng</div>
                    </div>
                    <span th:if="${unreadCounts.containsKey(user.id)}" 
                          class="unread-badge"
                          th:text="${unreadCounts.get(user.id)}">0</span>
                </div>
                <div th:if="${chattedUsers.isEmpty()}" class="p-4 text-center text-muted">
                    Chưa có cuộc trò chuyện nào.
                </div>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="chat-main">
            <!-- Trạng thái trống ban đầu -->
            <div class="empty-chat" id="emptyChat">
                <i class="fa-regular fa-comments"></i>
                <h5>Chọn một cuộc trò chuyện để bắt đầu</h5>
            </div>
            
            <!-- Khu vực chat thực tế -->
            <div id="activeChat" style="display: none; height: 100%; flex-direction: column;">
                <div class="chat-header">
                    <img id="chatHeaderAvatar" src="" class="user-avatar" alt="Avatar">
                    <div class="user-name" id="chatHeaderName">Tên người dùng</div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <!-- Tin nhắn sẽ được load bằng JS -->
                </div>
                
                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="messageInput" placeholder="Nhập tin nhắn của bạn..." autocomplete="off">
                    <button class="btn-send" id="btnSend">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>

<!-- WebSocket Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script th:inline="javascript">
    const currentUserId = /*[[${session.loggedInUser.id}]]*/ 0;
    let stompClient = null;
    let currentChatUserId = null;

    // Khởi tạo WebSocket kết nối khi load trang
    function connect() {
        const socket = new SockJS('/ws-chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // Tắt log debug của STOMP
        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            
            // Lắng nghe hàng đợi cá nhân của user
            stompClient.subscribe('/user/' + currentUserId + '/queue/messages', function (messageOutput) {
                showMessage(JSON.parse(messageOutput.body));
            });
        });
    }

    // Hiển thị tin nhắn lên UI
    function showMessage(message) {
        if ((message.senderId === currentUserId && message.receiverId === currentChatUserId) ||
            (message.senderId === currentChatUserId && message.receiverId === currentUserId)) {
            
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            const isSent = message.senderId === currentUserId;
            
            msgDiv.className = 'message ' + (isSent ? 'msg-sent' : 'msg-received');
            msgDiv.innerHTML = message.content + '<div class="msg-time">' + new Date(message.timestamp).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) + '</div>';
            
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
        }
    }

    // Mở một cuộc hội thoại
    function openChat(userId, userName, avatarUrl) {
        currentChatUserId = userId;
        
        // UI Updates
        document.getElementById('emptyChat').style.display = 'none';
        document.getElementById('activeChat').style.display = 'flex';
        document.getElementById('chatHeaderName').innerText = userName;
        document.getElementById('chatHeaderAvatar').src = avatarUrl;
        
        // Highlight active user
        document.querySelectorAll('.user-item').forEach(function(el) { el.classList.remove('active'); });
        var activeItem = document.getElementById('user-item-' + userId);
        if (activeItem) {
            activeItem.classList.add('active');
            // Ẩn badge chưa đọc khi mở cuộc trò chuyện
            var badge = activeItem.querySelector('.unread-badge');
            if (badge) badge.style.display = 'none';
        }

        // Load lịch sử tin nhắn
        loadMessageHistory(userId);
    }

    function loadMessageHistory(userId) {
        fetch('/api/messages/' + userId)
            .then(function(res) { return res.json(); })
            .then(function(messages) {
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                
                messages.forEach(function(message) {
                    const msgDiv = document.createElement('div');
                    const isSent = message.senderId === currentUserId;
                    
                    msgDiv.className = 'message ' + (isSent ? 'msg-sent' : 'msg-received');
                    msgDiv.innerHTML = message.content + '<div class="msg-time">' + new Date(message.timestamp).toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}) + '</div>';
                    chatMessages.appendChild(msgDiv);
                });
                
                scrollToBottom();
            });
    }

    function scrollToBottom() {
        const chatMessages = document.getElementById('chatMessages');
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Gửi tin nhắn
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        
        if (content && stompClient && currentChatUserId) {
            const chatMessage = {
                senderId: currentUserId,
                receiverId: currentChatUserId,
                content: content
            };
            stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));
            input.value = '';
        }
    }

    // Kết nối websocket + bind events khi trang tải xong
    document.addEventListener("DOMContentLoaded", function() {
        connect();
        
        // Bind click event cho tất cả user-item bằng data attributes
        document.querySelectorAll('.user-item').forEach(function(item) {
            item.addEventListener('click', function() {
                var userId = parseInt(this.getAttribute('data-user-id'));
                var userName = this.getAttribute('data-user-name');
                var avatarUrl = this.getAttribute('data-user-avatar');
                openChat(userId, userName, avatarUrl);
            });
        });

        // Bind nút gửi và Enter
        document.getElementById('btnSend').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Tự động mở chat nếu có tham số userId
        var autoOpenUserId = /*[[${autoOpenUserId}]]*/ null;
        if (autoOpenUserId) {
            var userItem = document.getElementById('user-item-' + autoOpenUserId);
            if (userItem) {
                userItem.click();
            }
        }
    });

</script>

</body>
</html>
