<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Trang cá nhân')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar('profile')}"></nav>

    <div class="container py-5">
        <div class="row">
            <!-- Alert Messages -->
            <div class="col-12 mb-3">
                <div class="alert alert-polyjobs alert-success" th:if="${success}">
                    <i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span>
                </div>
                <div class="alert alert-polyjobs alert-danger" th:if="${error}">
                    <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span>
                </div>
            </div>

            <!-- Avatar & Overview -->
            <div class="col-md-4 mb-4">
                <div class="card p-4 text-center">
                    <!-- Nếu là Ứng viên: Hiển thị avatar cá nhân và nút đổi ảnh -->
                    <div th:if="${user.role == false}">
                        <img th:src="${user.avatar != null ? user.avatar : 'https://ui-avatars.com/api/?name=' + user.fullname + '&background=random'}" class="rounded-circle mx-auto mb-3" style="width: 120px; height: 120px; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                        <form th:action="@{/profile/upload-avatar}" method="post" enctype="multipart/form-data" class="mb-3">
                            <input type="file" name="avatarFile" id="avatarFile" accept="image/*" class="d-none" onchange="this.form.submit()">
                            <label for="avatarFile" class="btn btn-sm btn-outline-primary" style="cursor: pointer;"><i class="fa-solid fa-camera"></i> Đổi ảnh</label>
                        </form>
                    </div>

                    <!-- Nếu là Nhà tuyển dụng: Hiển thị logo công ty (không có nút đổi ảnh ở đây vì đã có ở phần thông tin công ty) -->
                    <div th:if="${user.role == true}">
                        <img th:src="${company != null and company.logo != null ? company.logo : '/images/default-company.png'}" class="rounded-circle mx-auto mb-3 border" style="width: 120px; height: 120px; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                    </div>
                    <h4 th:text="${user.fullname}">Họ tên</h4>
                    <p class="text-muted" th:text="${user.email}">email@example.com</p>
                    <span class="badge bg-primary" th:if="${user.role == true}">Nhà tuyển dụng</span>
                    <span class="badge bg-secondary" th:if="${user.role == false}">Ứng viên</span>
                </div>
            </div>

            <!-- Profile details -->
            <div class="col-md-8">
                <!-- Chỉ hiển thị thông tin cá nhân cho ứng viên -->
                <div class="card p-4 mb-4 fade-in-up" th:if="${user.role == false}">
                    <h5 class="mb-4">Thông tin cá nhân</h5>
                    <form th:action="@{/profile/update}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Tên đăng nhập</label>
                            <input type="text" class="form-control" th:value="${user.username}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" class="form-control" name="fullname" th:value="${user.fullname}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" th:value="${user.email}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" name="phone" th:value="${user.phone}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text" class="form-control" name="address" th:value="${user.address}">
                        </div>
                        <div class="mb-3" th:if="${user.role == false}">
                            <label class="form-label">Ngành nghề / Chuyên ngành</label>
                            <input type="text" class="form-control" name="profession" th:value="${user.profession}" placeholder="Ví dụ: IT, Thiết kế đồ họa, Kế toán...">
                        </div>
                        <button type="submit" class="btn btn-primary" style="background: var(--gradient-primary); border: none;">Lưu thay đổi</button>
                    </form>
                </div>

                <!-- Company details (Only for Employer) -->
                <div class="card p-4 mb-4 fade-in-up" th:if="${user.role == true}">
                    <h5 class="mb-4">Thông tin Công ty</h5>
                    <div class="d-flex align-items-center mb-4">
                        <img th:src="${company != null and company.logo != null ? company.logo : '/images/default-company.png'}" 
                             alt="Logo công ty" class="rounded me-3 border" style="width: 80px; height: 80px; object-fit: cover;">
                        <div>
                            <h6 class="mb-1" th:text="${company != null ? company.companyName : 'Tên công ty'}"></h6>
                            <p class="text-muted small mb-0">Hãy cập nhật logo và thông tin chi tiết để thu hút ứng viên</p>
                        </div>
                    </div>
                    
                    <form th:action="@{/profile/update-company}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Tên Công ty</label>
                            <input type="text" class="form-control" name="companyName" th:value="${company != null ? company.companyName : ''}" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Website</label>
                                <input type="url" class="form-control" name="website" th:value="${company != null ? company.website : ''}" placeholder="https://...">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Địa chỉ Công ty</label>
                                <input type="text" class="form-control" name="address" th:value="${company != null ? company.address : ''}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tải lên Logo Công ty mới</label>
                            <input type="file" class="form-control" name="logoFile" accept="image/*">
                            <small class="text-muted">Chỉ nhận file ảnh, tối ưu là hình vuông.</small>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Giới thiệu về Công ty</label>
                            <textarea class="form-control" name="description" rows="5" placeholder="Mô tả về lịch sử, môi trường làm việc, chế độ đãi ngộ..." th:text="${company != null ? company.description : ''}"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="background: var(--gradient-primary); border: none;">Lưu thông tin Công ty</button>
                    </form>
                </div>



                
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
    <div th:replace="~{fragments :: scripts}"></div>

    <script>
    // Auto-scroll to the correct section based on ?tab= param
    document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const tab = params.get('tab');
        if (tab === 'applications') {
            const el = document.getElementById('section-applications');
            if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('highlight-section'); }
        } else if (tab === 'saved') {
            const el = document.getElementById('section-saved');
            if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('highlight-section'); }
        }
    });
    </script>
    <style>
    .highlight-section { animation: sectionPulse 1s ease; }
    @keyframes sectionPulse {
        0%   { box-shadow: 0 0 0 0 rgba(14,165,233,0.4); }
        50%  { box-shadow: 0 0 0 8px rgba(14,165,233,0.15); }
        100% { box-shadow: 0 0 0 0 rgba(14,165,233,0); }
    }
    </style>
</body>
</html>
