<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Đăng Ký Tài Khoản')}"></head>

<body>

    <div class="auth-page">
        <div class="auth-card register-card">
            <!-- Logo -->
            <div class="auth-logo">
                <i class="fa-solid fa-water"></i> PolyJobs
            </div>
            <h1 class="auth-title">Tạo Tài Khoản</h1>
            <p class="auth-subtitle">Tạo tài khoản để bắt đầu sử dụng PolyJobs</p>

            <!-- Role Tabs -->
            <div class="role-tabs" id="roleTabs" style="display: flex; gap: 0; margin-bottom: 24px; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--border-color);">
                <label style="flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; background: var(--gradient-cta); color: #fff;" id="tabCandidate" onclick="selectRole(false)">
                    <input type="radio" name="roleDisplay" style="display:none;" checked>
                    <i class="fa-solid fa-user me-1"></i> Ứng viên
                </label>
                <label style="flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; background: var(--bg-body); color: var(--text-secondary);" id="tabEmployer" onclick="selectRole(true)">
                    <input type="radio" name="roleDisplay" style="display:none;">
                    <i class="fa-solid fa-building me-1"></i> Nhà tuyển dụng
                </label>
            </div>

            <!-- Alert Messages -->
            <div class="alert alert-polyjobs alert-danger" th:if="${error}" id="alertError">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span th:text="${error}">Lỗi</span>
            </div>

            <!-- Register Form -->
            <form class="auth-form" action="/register" method="post" id="registerForm">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="fullname" class="form-label">Họ và tên <span style="color: #ef4444;">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                            <input type="text" class="form-control" id="fullname" name="fullname"
                                placeholder="Nguyễn Văn A" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="username" class="form-label">Tên đăng nhập <span style="color: #ef4444;">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="username" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="password" class="form-label">Mật khẩu <span style="color: #ef4444;">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email <span style="color: #ef4444;">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="email@example.com" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                            <input type="tel" class="form-control" id="phone" name="phone"
                                placeholder="0901 234 567">
                        </div>
                    </div>

                    <!-- Company Info Fields (Chỉ hiện khi chọn Nhà tuyển dụng) -->
                    <div id="companyFields" class="col-12" style="display: none;">
                        <div class="p-3 mt-2" style="background: var(--primary-50); border: 1px solid var(--primary-100); border-radius: var(--radius-md);">
                            <h6 style="font-weight: 700; color: var(--primary-dark); margin-bottom: 12px; font-size: 0.95rem;">
                                <i class="fa-solid fa-building-circle-check me-1"></i> Thông tin xác minh doanh nghiệp
                            </h6>
                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="companyName" class="form-label">Tên doanh nghiệp / công ty <span style="color: #ef4444;">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-building"></i></span>
                                        <input type="text" class="form-control" id="companyName" name="companyName"
                                            placeholder="Công ty TNHH Giải Pháp Miền Tây">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="companyAddress" class="form-label">Trụ sở / Địa chỉ tại miền Tây <span style="color: #ef4444;">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                                        <input type="text" class="form-control" id="companyAddress" name="companyAddress"
                                            placeholder="Q. Ninh Kiều, TP. Cần Thơ">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="companyWebsite" class="form-label">Website doanh nghiệp</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-globe"></i></span>
                                        <input type="url" class="form-control" id="companyWebsite" name="companyWebsite"
                                            placeholder="https://company.vn">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Hidden role field -->
                    <input type="hidden" id="role" name="role" value="false">
                </div>

                <button type="submit" class="btn-auth mt-4" id="btnRegister">
                    <i class="fa-solid fa-user-plus me-2"></i> Đăng Ký
                </button>
            </form>

            <div class="auth-divider">hoặc</div>

            <div class="auth-footer">
                Đã có tài khoản?
                <a th:href="@{/login}">Đăng nhập ngay</a>
            </div>

            <div style="text-align: center; margin-top: 16px;">
                <a th:href="@{/}" style="color: var(--text-muted); font-size: 0.85rem;">
                    <i class="fa-solid fa-arrow-left me-1"></i> Quay về trang chủ
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selectRole(isEmployer) {
            document.getElementById('role').value = isEmployer ? 'true' : 'false';
            const tabCandidate = document.getElementById('tabCandidate');
            const tabEmployer = document.getElementById('tabEmployer');
            const companyFields = document.getElementById('companyFields');
            const companyName = document.getElementById('companyName');
            const companyAddress = document.getElementById('companyAddress');

            if (isEmployer) {
                tabEmployer.style.background = 'var(--gradient-cta)';
                tabEmployer.style.color = '#fff';
                tabCandidate.style.background = 'var(--bg-body)';
                tabCandidate.style.color = 'var(--text-secondary)';
                
                companyFields.style.display = 'block';
                companyName.required = true;
                companyAddress.required = true;
            } else {
                tabCandidate.style.background = 'var(--gradient-cta)';
                tabCandidate.style.color = '#fff';
                tabEmployer.style.background = 'var(--bg-body)';
                tabEmployer.style.color = 'var(--text-secondary)';
                
                companyFields.style.display = 'none';
                companyName.required = false;
                companyAddress.required = false;
            }
        }

        // Tự động mở tab Nhà tuyển dụng nếu url có ?role=employer
        window.addEventListener('DOMContentLoaded', function() {
            const initialRole = [[${initialRole != null && initialRole}]];
            if (initialRole) {
                selectRole(true);
            }
        });
    </script>
</body>

</html>
