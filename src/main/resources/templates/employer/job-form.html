<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${job != null ? 'Sửa tin tuyển dụng' : 'Đăng tin tuyển dụng'})}"></head>
<body>
<nav th:replace="~{fragments :: navbar('employer')}"></nav>

<div style="background:#f8f9fc; min-height:calc(100vh - 72px); padding: 32px 0;">
    <div class="container" style="max-width:820px;">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 style="font-weight:800;margin:0;color:#1e293b;" th:text="${job != null ? 'Chỉnh sửa tin tuyển dụng' : 'Đăng tin tuyển dụng mới'}">Đăng tin</h4>
                <p style="color:#64748b;font-size:.85rem;margin:4px 0 0;">Điền đầy đủ thông tin để tiếp cận nhiều ứng viên hơn</p>
            </div>
            <a th:href="@{/employer/jobs}" style="display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:10px;border:1.5px solid #e8eaf0;font-size:.835rem;font-weight:600;color:#64748b;text-decoration:none;background:#fff;">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </a>
        </div>

        <form th:action="@{/employer/job/save}" method="post">
            <input type="hidden" name="id" th:value="${job?.id}">

            <!-- Section 1: Basic Info -->
            <div style="background:#fff;border-radius:16px;border:1.5px solid #e8eaf0;padding:28px;margin-bottom:20px;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #f1f5f9;">
                    <div style="width:34px;height:34px;background:rgba(99,102,241,.1);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#6366f1;font-size:.95rem;flex-shrink:0;">
                        <i class="fa-solid fa-file-lines"></i>
                    </div>
                    <div>
                        <div style="font-weight:700;color:#1e293b;">Thông tin cơ bản</div>
                        <div style="font-size:.78rem;color:#94a3b8;">Thông tin chính về vị trí tuyển dụng</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Tiêu đề công việc <span style="color:#ef4444;">*</span></label>
                    <input type="text" name="title" th:value="${job?.title}" required
                           placeholder="Ví dụ: Lập trình viên Java Senior"
                           style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit;"
                           onfocus="this.style.borderColor='#6366f1';this.style.boxShadow='0 0 0 3px rgba(99,102,241,.12)'"
                           onblur="this.style.borderColor='#e8eaf0';this.style.boxShadow=''">
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Ngành nghề <span style="color:#ef4444;">*</span></label>
                        <select name="categoryId" required
                                style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;background:#fff;font-family:inherit;transition:border-color .2s;"
                                onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e8eaf0'">
                            <option value="" disabled selected>-- Chọn ngành nghề --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${job?.category?.id == cat.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Khu vực làm việc <span style="color:#ef4444;">*</span></label>
                        <select name="location" required
                                style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;background:#fff;font-family:inherit;transition:border-color .2s;"
                                onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e8eaf0'">
                            <option value="" disabled selected>-- Chọn tỉnh thành --</option>
                            <option value="An Giang"   th:selected="${job?.location == 'An Giang'}">An Giang</option>
                            <option value="Bạc Liêu"   th:selected="${job?.location == 'Bạc Liêu'}">Bạc Liêu</option>
                            <option value="Bến Tre"    th:selected="${job?.location == 'Bến Tre'}">Bến Tre</option>
                            <option value="Cà Mau"     th:selected="${job?.location == 'Cà Mau'}">Cà Mau</option>
                            <option value="Cần Thơ"    th:selected="${job?.location == 'Cần Thơ'}">Cần Thơ</option>
                            <option value="Đồng Tháp"  th:selected="${job?.location == 'Đồng Tháp'}">Đồng Tháp</option>
                            <option value="Hậu Giang"  th:selected="${job?.location == 'Hậu Giang'}">Hậu Giang</option>
                            <option value="Kiên Giang" th:selected="${job?.location == 'Kiên Giang'}">Kiên Giang</option>
                            <option value="Long An"    th:selected="${job?.location == 'Long An'}">Long An</option>
                            <option value="Sóc Trăng"  th:selected="${job?.location == 'Sóc Trăng'}">Sóc Trăng</option>
                            <option value="Tiền Giang" th:selected="${job?.location == 'Tiền Giang'}">Tiền Giang</option>
                            <option value="Trà Vinh"   th:selected="${job?.location == 'Trà Vinh'}">Trà Vinh</option>
                            <option value="Vĩnh Long"  th:selected="${job?.location == 'Vĩnh Long'}">Vĩnh Long</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Mức lương</label>
                        <input type="text" name="salary" th:value="${job?.salary}"
                               placeholder="Ví dụ: 15 - 20 triệu, Thỏa thuận..."
                               style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;transition:all .2s;font-family:inherit;"
                               onfocus="this.style.borderColor='#6366f1';this.style.boxShadow='0 0 0 3px rgba(99,102,241,.12)'" onblur="this.style.borderColor='#e8eaf0';this.style.boxShadow=''">
                    </div>
                    <div class="col-md-6">
                        <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Kinh nghiệm yêu cầu</label>
                        <input type="text" name="experience" th:value="${job?.experience}"
                               placeholder="Ví dụ: Không yêu cầu, 1 năm, 2 năm..."
                               style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;transition:all .2s;font-family:inherit;"
                               onfocus="this.style.borderColor='#6366f1';this.style.boxShadow='0 0 0 3px rgba(99,102,241,.12)'" onblur="this.style.borderColor='#e8eaf0';this.style.boxShadow=''">
                    </div>
                    <div class="col-md-6">
                        <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Hình thức làm việc</label>
                        <select name="workingType" style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;background:#fff;font-family:inherit;" onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#e8eaf0'">
                            <option value="Toàn thời gian" th:selected="${job?.workingType == 'Toàn thời gian'}">Toàn thời gian</option>
                            <option value="Bán thời gian"  th:selected="${job?.workingType == 'Bán thời gian'}">Bán thời gian</option>
                            <option value="Thực tập"       th:selected="${job?.workingType == 'Thực tập'}">Thực tập</option>
                            <option value="Freelance"      th:selected="${job?.workingType == 'Freelance'}">Freelance</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Số lượng tuyển</label>
                        <input type="number" name="quantity" th:value="${job?.quantity}" min="1"
                               placeholder="Ví dụ: 1"
                               style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;transition:all .2s;font-family:inherit;"
                               onfocus="this.style.borderColor='#6366f1';this.style.boxShadow='0 0 0 3px rgba(99,102,241,.12)'" onblur="this.style.borderColor='#e8eaf0';this.style.boxShadow=''">
                    </div>
                </div>
            </div>

            <!-- Section 2: Description -->
            <div style="background:#fff;border-radius:16px;border:1.5px solid #e8eaf0;padding:28px;margin-bottom:20px;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #f1f5f9;">
                    <div style="width:34px;height:34px;background:rgba(34,197,94,.1);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#16a34a;font-size:.95rem;flex-shrink:0;">
                        <i class="fa-solid fa-align-left"></i>
                    </div>
                    <div>
                        <div style="font-weight:700;color:#1e293b;">Nội dung chi tiết</div>
                        <div style="font-size:.78rem;color:#94a3b8;">Mô tả công việc và quyền lợi ứng viên</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Mô tả công việc <span style="color:#ef4444;">*</span></label>
                    <textarea name="description" rows="7" required
                              placeholder="- Tham gia phát triển các tính năng...&#10;- Xây dựng và duy trì hệ thống...&#10;- Phối hợp với team Design/BA..."
                              style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;resize:vertical;font-family:inherit;transition:all .2s;line-height:1.6;"
                              onfocus="this.style.borderColor='#6366f1';this.style.boxShadow='0 0 0 3px rgba(99,102,241,.12)'" onblur="this.style.borderColor='#e8eaf0';this.style.boxShadow=''"
                              th:text="${job?.description}"></textarea>
                </div>
                <div>
                    <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Quyền lợi được hưởng</label>
                    <textarea name="benefit" rows="4"
                              placeholder="- Lương tháng 13&#10;- BHXH, BHYT đầy đủ&#10;- Du lịch hàng năm..."
                              style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;resize:vertical;font-family:inherit;transition:all .2s;line-height:1.6;"
                              onfocus="this.style.borderColor='#6366f1';this.style.boxShadow='0 0 0 3px rgba(99,102,241,.12)'" onblur="this.style.borderColor='#e8eaf0';this.style.boxShadow=''"
                              th:text="${job?.benefit}"></textarea>
                </div>
            </div>

            <!-- Section 3: Settings -->
            <div style="background:#fff;border-radius:16px;border:1.5px solid #e8eaf0;padding:28px;margin-bottom:24px;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #f1f5f9;">
                    <div style="width:34px;height:34px;background:rgba(245,158,11,.1);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#d97706;font-size:.95rem;flex-shrink:0;">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <div>
                        <div style="font-weight:700;color:#1e293b;">Cài đặt đăng tải</div>
                        <div style="font-size:.78rem;color:#94a3b8;">Thời hạn và trạng thái hiển thị</div>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label style="display:block;font-size:.83rem;font-weight:600;color:#374151;margin-bottom:6px;">Hạn nộp hồ sơ <span style="color:#ef4444;">*</span></label>
                        <input type="date" name="deadline" required
                               th:value="${job?.deadline != null ? #dates.format(job.deadline, 'yyyy-MM-dd') : ''}"
                               style="width:100%;padding:11px 14px;border:1.5px solid #e8eaf0;border-radius:10px;font-size:.875rem;outline:none;font-family:inherit;transition:all .2s;"
                               onfocus="this.style.borderColor='#6366f1';this.style.boxShadow='0 0 0 3px rgba(99,102,241,.12)'" onblur="this.style.borderColor='#e8eaf0';this.style.boxShadow=''">
                    </div>
                    <div class="col-md-6 d-flex align-items-end">
                        <div style="background:#f8f9fc;border-radius:10px;padding:12px 16px;width:100%;display:flex;align-items:center;justify-content:space-between;">
                            <div>
                                <div style="font-weight:600;font-size:.875rem;color:#1e293b;">Mở nhận hồ sơ</div>
                                <div style="font-size:.78rem;color:#64748b;margin-top:2px;">Tin sẽ hiển thị công khai</div>
                            </div>
                            <label class="adm-switch" style="transform:scale(1.1);">
                                <input type="checkbox" name="status" id="statusSwitch" th:checked="${job == null or job.status}">
                                <span class="adm-switch-slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <div class="d-flex justify-content-end gap-3">
                <a th:href="@{/employer/jobs}" style="display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:10px;border:1.5px solid #e8eaf0;font-size:.875rem;font-weight:600;color:#64748b;text-decoration:none;background:#fff;">
                    Hủy bỏ
                </a>
                <button type="submit" style="display:inline-flex;align-items:center;gap:8px;padding:11px 28px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;font-weight:700;font-size:.875rem;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(99,102,241,.35);transition:all .2s;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform=''">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span th:text="${job != null ? 'Cập nhật tin' : 'Đăng tin tuyển dụng'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<style>
.adm-switch { position: relative; display: inline-block; width: 42px; height: 24px; }
.adm-switch input { opacity: 0; width: 0; height: 0; }
.adm-switch-slider { position: absolute; inset: 0; border-radius: 24px; background: #e2e8f0; cursor: pointer; transition: .25s; }
.adm-switch-slider::before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; border-radius: 50%; background: #fff; transition: .25s; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.adm-switch input:checked + .adm-switch-slider { background: #6366f1; }
.adm-switch input:checked + .adm-switch-slider::before { transform: translateX(18px); }
</style>

<footer th:replace="~{fragments :: footer}"></footer>
<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
